# -----------------------------------------------------------------------
# flamengomatchday
# -----------------------------------------------------------------------

flamengomatchday.application-context=flamengomatchday-spring.xml

# Minutos que a poltrona fica segura no carrinho (o front mostra o mesmo prazo)
flamengomatchday.seathold.minutes=15

# Produtos tratados como poltrona: variantes cujo código começa com este prefixo
flamengomatchday.seat.codeprefix=JOGO-

# Depósito preferido para baixar o estoque
flamengomatchday.warehouse=warehouse_s

# Jogos (tela "Jogos" no Backoffice)
flamengomatchday.catalog=flamengoProductCatalog
flamengomatchday.template=FLA-TEMPLATE-MARACANA
flamengomatchday.storecategory=flamengo_jogos_casa
flamengomatchday.currency=BRL
flamengomatchday.solr.cronjob=full-electronicsIndex-cronJob

# Sócio-torcedor: suspensão por inadimplência (evento "Suspensão" no Backoffice ou pelo
# Claude tira a onda de sócio e os descontos). false = ninguém novo é suspenso;
# regularizar continua funcionando.
flamengo.socio.suspensao.ativa=true

# Elegibilidade para comprar ingresso (SocioEligibilityService): cada tentativa de
# pôr poltrona no carrinho é conferida e gravada (Sócio-Torcedor › Decisões de elegibilidade).
# registro: grava as decisões. bloqueio: false = só observa; true = recusa a poltrona com o motivo.
flamengo.socio.elegibilidade.registro=true
flamengo.socio.elegibilidade.bloqueio=false
# Biometria facial: false = só informativa; true = sem biometria validada não compra
flamengo.socio.biometria.exigida=false
# Ingressos por jogo para quem não é sócio (sócio: titular + convidados do plano)
flamengo.ingressos.limite.geral=4

log4j2.logger.flamengomatchday.name=br.com.flamengo.matchday
log4j2.logger.flamengomatchday.level=INFO
log4j2.logger.flamengomatchday.appenderRef.stdout.ref=STDOUT
