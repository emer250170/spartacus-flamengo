# -----------------------------------------------------------------------
# flamengomatchday
# -----------------------------------------------------------------------

flamengomatchday.application-context=flamengomatchday-spring.xml

# Minutos que a poltrona fica segura no carrinho (o front mostra o mesmo prazo)
flamengomatchday.seathold.minutes=15

# Produtos tratados como poltrona: variantes cujo código começa com este prefixo
flamengomatchday.seat.codeprefix=JOGO-

# Depósito preferido para baixar o estoque
flamengomatchday.warehouse=warehouse_s

log4j2.logger.flamengomatchday.name=br.com.flamengo.matchday
log4j2.logger.flamengomatchday.level=INFO
log4j2.logger.flamengomatchday.appenderRef.stdout.ref=STDOUT
