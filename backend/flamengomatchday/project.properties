# -----------------------------------------------------------------------
# flamengomatchday
# -----------------------------------------------------------------------

flamengomatchday.application-context=flamengomatchday-spring.xml

# Minutos que a poltrona fica segura no carrinho (o front mostra o mesmo prazo)
flamengomatchday.seathold.minutes=15
# Reserva vencida trava o pedido: o carrinho avisa e o fechamento recusa até o torcedor retirar a poltrona e
# reservar de novo (08/11). false = como antes (a poltrona é reservada de novo se ainda estiver livre)
flamengo.matchday.reservaVencida.bloqueia=true

# Produtos tratados como poltrona: variantes cujo código começa com este prefixo
flamengomatchday.seat.codeprefix=JOGO-

# Depósito preferido para baixar o estoque
flamengomatchday.warehouse=warehouse_s

# Jogos (tela "Jogos" no Backoffice)
flamengomatchday.catalog=flamengoProductCatalog
flamengomatchday.template=FLA-TEMPLATE-MARACANA
flamengomatchday.storecategory=flamengo_jogos_casa
flamengomatchday.currency=BRL
flamengomatchday.solr.cronjob=full-electronicsIndex-cronJob

# Sócio-torcedor: suspensão por inadimplência (evento "Suspensão" no Backoffice ou pelo
# Claude tira a onda de sócio e os descontos). false = ninguém novo é suspenso;
# regularizar continua funcionando.
flamengo.socio.suspensao.ativa=true

# Elegibilidade para comprar ingresso (SocioEligibilityService): cada tentativa de
# pôr poltrona no carrinho é conferida e gravada (Sócio-Torcedor › Decisões de elegibilidade).
# registro: grava as decisões. bloqueio: false = só observa; true = recusa a poltrona com o motivo.
flamengo.socio.elegibilidade.registro=true
flamengo.socio.elegibilidade.bloqueio=false
# Biometria facial: false = só informativa; true = sem biometria validada não compra
flamengo.socio.biometria.exigida=false
# Ingressos por jogo para quem não é sócio (sócio: titular + convidados do plano)
flamengo.ingressos.limite.geral=4
# não sócio com várias poltronas do mesmo jogo: o pedido só fecha com nome, CPF,
# nascimento e e-mail de quem vai usar cada ingresso adicional (o 1º fica no nome do comprador)
flamengo.ingressos.portador.obrigatorio=true

# Convidados nominais (Meus convidados): false esconde o cadastro na loja e recusa inclusões
flamengo.socio.convidados.ativo=true
# Ingresso nominal: no pedido do sócio, cada poltrona além da dele no mesmo jogo precisa de convidado
flamengo.socio.convidados.ingressoNominal=true
# Limite por jogo do sócio: true = titular + vagas de convidado contratadas; false = titular + máximo do plano
flamengo.socio.convidados.limiteContratado=true
# Plano ainda no carrinho (04/11): o titular cadastra convidados no stepper e compra o ingresso
# deles no mesmo pedido; se o plano sair do carrinho, esses convidados são apagados
flamengo.socio.convidados.carrinho.ativo=true

# Termo do Nação versionado: pedido com plano exige o aceite da versão atual (publicada
# no Backoffice); a área do sócio pede o aceite de versão nova. false = como antes
flamengo.socio.termo.ativo=true

# Regras de saída do sócio (arrependimento, multa e reembolso): simulação na área do
# sócio e na ficha do Backoffice; valores gravados no evento quando o cancelamento é
# confirmado. Vale o dia do pedido de cancelamento. false = cancelamento como antes
flamengo.socio.saida.ativo=true
# Prazo de arrependimento em dias corridos a partir da adesão: reembolso do que foi pago na adesão
flamengo.socio.saida.arrependimento.dias=7
# Fora do prazo: multa em % sobre as mensalidades restantes do contrato de 12 meses (plano + convidados)
flamengo.socio.saida.multa.percentual=10

# Vigência do sócio (renovação, upgrade e downgrade): contrato de 12 meses com renovação
# automática; o sócio desliga a renovação ou agenda um plano menor até o prazo; o gestor
# vira a vigência no Backoffice ou pelo Claude. false = vigência calculada do pedido, como antes
flamengo.socio.vigencia.ativo=true
# Até quantos dias antes do fim da vigência o sócio pode desligar a renovação ou agendar a mudança
flamengo.socio.vigencia.prazoRenovacao.dias=30

# Pix e boleto à vista e plano aguardando pagamento (item 7): com plano no carrinho, o checkout
# oferece cartão com a mensalidade, cartão com o ano inteiro em parcelas, e Pix ou boleto com o ano
# inteiro (12 mensalidades do plano e dos convidados); Pix/boleto só ativam o plano quando o gestor
# confirma o pagamento. false = só cartão com a mensalidade, como antes
flamengo.socio.pagamento.ativo=true
# Parcelas no cartão (ano inteiro), validade do Pix (minutos) e do boleto (dias)
flamengo.socio.pagamento.parcelas=12
flamengo.socio.pagamento.pix.minutos=30
flamengo.socio.pagamento.boleto.dias=3
# Checagem de fraude padrão: pedidos acima deste valor (R$) vão pontuando até a revisão manual
# (padrão do Commerce: 1000; o ano inteiro dos planos maiores passa disso). Vazio = padrão
flamengo.fraude.limitePedido=10000

# Pontos e experiências (item 8): cada ingresso e cada real em produtos (plano e convidados não
# contam) dão pontos nos pedidos desde a adesão; o sócio em dia resgata experiências cadastradas no
# Backoffice (voucher). false = sem pontos na loja, na ficha e no Claude
flamengo.socio.pontos.ativo=true
flamengo.socio.pontos.porIngresso=100
flamengo.socio.pontos.porReal=1
# Bônus de adesão: pontos que o sócio ganha uma vez, na adesão (0 = sem bônus)
flamengo.socio.pontos.bonusAdesao=500

# Experiências vendidas na loja (item 9): experiência com preço vira produto (categoria
# "experiencias", sem desconto de sócio); venda e resgate usam as mesmas vagas.
# false = nada vai para a loja (o resgate com pontos continua).
flamengo.socio.experiencias.venda.ativo=true
# Entrega das experiências: carrinho só de experiências com voucher (tour, treino, foto...)
# mostra só "Ingresso digital" (R$ 0, voucher em Meus resgates); com experiência que vai pelo
# correio (códigos abaixo, separados por vírgula) mostra só a entrega com frete. Carrinho
# misto não muda. false = todos os modos, como antes.
flamengo.socio.experiencias.entrega.ativo=true
flamengo.socio.experiencias.comEnvio=MANTO-AUTOGRAFADO

# Ingressos vendidos (item 10): cada poltrona vendida vira um ingresso que o gestor de jogos
# acompanha no cockpit Matchday (trocar poltrona no mesmo setor, trocar quem vai usar,
# cancelar com reembolso, marcar como utilizado, observação). Reembolso integral até
# horasIntegral antes do jogo, depois percentualDepois % até o início; depois do início não
# cancela. false = os ingressos continuam registrados, mas as ações ficam recusadas.
flamengo.matchday.ingressos.ativo=true
# Pedido com plano em Pix/boleto: os ingressos ficam "Aguardando pagamento" e só valem quando o
# gestor confirma o pagamento (04/11); false = valem na hora, como antes
flamengo.matchday.ingressos.aguardarPagamento=true
flamengo.matchday.ingressos.reembolso.horasIntegral=48
flamengo.matchday.ingressos.reembolso.percentualDepois=80

# Retirada na loja física (item 12): linha com loja de retirada vira remessa do OMS (passo
# sourcePickup do order-process, que reserva o estoque da loja) e o atendente trabalha no
# cockpit Expedição de pedidos. false = sem remessa; a linha baixa o estoque como as outras.
flamengo.retirada.ativo=true

# Item 14 do plano de evolução: operação do pedido da loja. Cartão, Pix ou boleto também no
# carrinho sem plano; qualquer pedido com Pix ou boleto fica "Aguardando pagamento" até o status
# mudar para "Pagamento confirmado"; produtos físicos com entrega em casa viram remessa do
# warehouse_s (separar, embalar e enviar no cockpit Expedição) e o pedido só fica "Concluído"
# depois do envio ou da retirada. Começa desligada: ligar pelo HAC depois de conferir os atos 1 a 6.
flamengo.loja.operacao.ativo=false
# Depósito da entrega em casa e prefixos de código que nunca têm remessa (fecham na hora)
flamengo.loja.operacao.deposito=warehouse_s
flamengo.loja.operacao.semRemessa=JOGO-,EXP-,NACAO-,FLA-EST-,FLA-FOOD-,FLA-PERSONALIZACAO,FLA-PERS-

# Painel inicial do gestor de merchandising (Backoffice > Cockpit de administração):
# grupo de promoção do site, janela de uso de cupons e desconto (dias) e janela de "vencendo" (dias)
flamengo.merch.painel.grupoPromocao=electronicsPromoGrp
flamengo.merch.painel.dias=30
flamengo.merch.painel.vencendoDias=7

# Imagem dos jogos e das experiências (04/11): ao salvar, a foto vai para o produto da loja
# (JOGO-... e EXP-...) nos formatos abaixo, reduzida sem cortar. Desligada: a imagem fica só no
# jogo ou na experiência. Sem imagem, nada muda no produto.
flamengo.produtos.imagem.copiar.ativo=true
flamengo.produtos.imagem.formatos=515Wx515H,300Wx300H,96Wx96H,65Wx65H
flamengo.produtos.imagem.formato.principal=300Wx300H
flamengo.produtos.imagem.formato.miniatura=96Wx96H
# Fotos nítidas (07/11): a foto "zoom" da loja (página do produto, ampliada e listagem) é gravada com até
# 1600 px de lado, se a foto enviada tiver isso (nunca aumenta). Sem a chave, 515 px como antes.
flamengo.produtos.imagem.tamanho.515Wx515H=1600Wx1600H
# Qualidade do JPG gravado (0 a 1)
flamengo.produtos.imagem.qualidade=0.9
# Foto nova (07/11): atualiza a busca (Solr) só do produto, alguns segundos depois de gravar, para a vitrine da
# home não ficar com o endereço antigo da foto. Desligada, a busca só muda no próximo índice.
flamengo.produtos.imagem.reindexar=true
flamengo.produtos.imagem.reindexar.config=electronicsIndex
flamengo.produtos.imagem.reindexar.segundos=10

log4j2.logger.flamengomatchday.name=br.com.flamengo.matchday
log4j2.logger.flamengomatchday.level=INFO
log4j2.logger.flamengomatchday.appenderRef.stdout.ref=STDOUT

# Atendimento do pedido (Backoffice): concluir "Pick up" ou "Shipping" logo depois do Packing
# espera o processo da consignação ficar pronto (o motor de tarefas leva de 10 a 20 s) em vez de
# mostrar erro. Segundos de espera; 0 = comportamento padrão do SAP (erro se clicar cedo).
# Ligado pelo jobHandler dos modelos NPR_Automated_* (08-atendimento-espera.impex)
flamengo.oms.tarefa.espera.segundos=40

# Pagamento pela Adyen (05/11): API de Checkout (fluxo Sessions), Drop-in na loja e webhook.
# Desligado = pagamento simulado de hoje (cartão do provedor de teste, Pix e boleto simulados).
# Conta, chaves e webhook ficam na loja base (Backoffice > Loja base > aba Adyen).
flamengo.pagamento.adyen.ativo=false
flamengo.pagamento.adyen.loja=electronics
flamengo.pagamento.adyen.checkoutUrl=https://checkout-test.adyen.com/v71
flamengo.pagamento.adyen.retorno=https://spartacus-flamengo.democc.online/electronics-spa/pt/BRL/checkout/review-order
flamengo.pagamento.adyen.timeoutSegundos=20
# Meios que passam pela Adyen (05/11): scheme (cartão), pix, boletobancario. O que não está na lista
# segue o pagamento simulado de hoje. Cartão fica de fora até a Adyen liberar Visa/Mastercard na conta;
# depois é só incluir scheme (HAC > Platform > Configuration, sem deploy).
# 05/11: na conta de teste o Pix volta sem QR Code (ação "await"; pedido ao suporte da Adyen). Enquanto isso,
# o Pix segue simulado; quando a Adyen corrigir, incluir pix. Cartões ativos na conta desde 05/11 (scheme).
flamengo.pagamento.adyen.meios=scheme,boletobancario
# Pix pela Adyen como Pix Automático (05/11): na conta de teste, só o Pix com recorrência devolve o QR Code
# (link do simulador da Adyen: o torcedor abre e escolhe "Pagamento aprovado"; o webhook confirma o pedido).
# Para usar: meios=scheme,pix,boletobancario e pix.automatico=true. false = Pix comum (sem QR Code na conta de teste).
flamengo.pagamento.adyen.pix.automatico=false
# Variante do boleto na conta Adyen (/paymentMethods devolve boletobancario_santander)
flamengo.pagamento.adyen.boleto.tipo=boletobancario_santander

# Condição "Forma de pagamento" no construtor de promoções (05/11): leva a forma escolhida no checkout
# (PIX, BOLETO, CARTAO_MENSAL, CARTAO_ANUAL, PIX_AUTOMATICO; "@PLANO" com plano no carrinho) ao motor de
# promoções. Sem regra que use a condição, nada muda. false = o motor não recebe a forma.
flamengo.promocao.formaPagamento.ativo=true

# Personalização do manto na página do produto (06/11): nome e número, kit de patrocínio e patch.
# ativo=false: a página do produto não oferece e a API recusa (comportamento anterior).
flamengo.personalizacao.ativo=true
# categorias (com as subcategorias) cujos produtos podem ser personalizados
flamengo.personalizacao.categorias=flamengo_c115
# produtos de preço de cada opção (ImpEx docs/flamengo-matchday/09-personalizacao.impex)
flamengo.personalizacao.nomeNumero=FLA-PERS-NOMENUMERO
flamengo.personalizacao.patrocinio=FLA-PERS-PATROCINIO
flamengo.personalizacao.patches=FLA-PERS-PATCH-LIBERTADORES,FLA-PERS-PATCH-BRASILEIRO
# camisa do dia de jogo (07/11): nome e número com o produto de preço da jornada de matchday
# (R$ 40,00), sem patrocínio nem patch; vazio = a camisa usa as opções de sempre
flamengo.personalizacao.matchday.categorias=flamengo_matchday
flamengo.personalizacao.matchday.nomeNumero=FLA-PERSONALIZACAO

# "Calcule o frete" na página do produto (06/11): formas de entrega da loja para o Brasil com o
# preço cadastrado. ativo=false: a API devolve a lista vazia. ignorar: modos sem frete (ingresso).
flamengo.frete.simulacao.ativo=true
flamengo.frete.simulacao.ignorar=matchday-digital

# Retirada no estádio (06/11): o modo "Ingresso digital e retirada no estádio" (matchday-digital)
# só aparece com item do dia de jogo no carrinho (prefixos abaixo). Carrinho com produto físico da
# loja e sem item de jogo vê só as entregas com frete. ativo=false: como antes.
flamengo.entrega.estadio.ativo=true
flamengo.entrega.estadio.prefixos=JOGO-,FLA-EST-,FLA-FOOD-

# Catálogo de produtos para o Emarsys (06/11): GET /{baseSiteId}/emarsys/produtos.csv (público) e
# /emarsys/categorias (caminho de cada categoria, para o comando category do Web Extend).
# ativo=false: as duas respostas são 404. cache.minutos: tempo até gerar de novo.
flamengo.emarsys.catalogo.ativo=true
flamengo.emarsys.catalogo.cache.minutos=60
flamengo.emarsys.catalogo.id=flamengoProductCatalog
flamengo.emarsys.catalogo.versao=Online
flamengo.emarsys.deposito=warehouse_s
flamengo.emarsys.loja.url=https://spartacus-flamengo.democc.online/electronics-spa
flamengo.emarsys.midia.url=https://api-flamengo.democc.online
flamengo.emarsys.descricao.max=1000
# Nome do campo próprio com o tipo do produto (ex.: c_tipo), só depois de criado no Emarsys.
# Vazio: a coluna não vai no CSV (o Emarsys recusa coluna desconhecida).
flamengo.emarsys.catalogo.campoTipo=

# E-mails com as imagens embutidas na mensagem (07/11): o Outlook bloqueia imagem por link de remetente
# desconhecido; embutida ela aparece direto. false = envio padrão do Commerce (imagens por link).
# urlBase: base para imagem com endereço relativo (as do template são absolutas).
flamengo.email.imagensEmbutidas=true
flamengo.email.imagens.urlBase=https://spartacus-flamengo.democc.online/

# Criar conta com CPF (07/11): a loja manda o CPF no cadastro (POST /users?cpf=...). Ligada, o CPF é
# conferido (dígitos verificadores, sem repetir entre contas) e gravado no torcedor (Customer.cpf).
# Desligada, o parâmetro é ignorado e o cadastro segue como antes.
flamengo.cadastro.cpf.ativo=true
# Telefone no cadastro (07/11, para o ClearSale): POST /users?telefone=... conferido (DDD + número) e gravado em
# Customer.phone. false = o parâmetro é ignorado.
flamengo.cadastro.telefone.ativo=true

# ClearSale, Realtime Decision (07/11): análise de fraude no order-process (passo clearSaleCheck).
# Liga/desliga, usuário, senha (criptografada), endereço da API, chave do fingerprint e lista de e-mails ficam na
# aba ClearSale da loja base (Backoffice). Esta chave é a geral: false desliga mesmo com a loja ligada.
flamengo.clearsale.ativo=true
# Tempo máximo da chamada (ms); sem resposta, o pedido segue aprovado e fica marcado INDISPONIVEL
flamengo.clearsale.timeoutMs=8000
# Decisões que cancelam o pedido (o resto segue)
flamengo.clearsale.recusa=RPA,RPP,RPM,SUS,FRD
# A demo guarda o cartão mascarado: sem os 6 primeiros números, este bin vai para o ClearSale (homologação)
flamengo.clearsale.binTeste=411111

# Mengo Estúdio (07/11): camisetas sob demanda com estampas que saem de linha (drop, linha, estampa).
# false = a API do Estúdio responde {"ativo":false} e a loja esconde a área; nada mais muda.
flamengo.estudio.ativo=true
flamengo.estudio.catalogo=flamengoProductCatalog
flamengo.estudio.fuso=America/Sao_Paulo
# Faixas da estampa: Últimas 48 h (até N horas para encerrar), Últimos dias (até N dias), Nova (lançada há até N dias)
flamengo.estudio.ultimas.horas=48
flamengo.estudio.ultimos.dias=7
flamengo.estudio.nova.dias=7
# Parcelamento demonstrativo: até N vezes, parcela mínima em reais; quantidade por linha do carrinho
flamengo.estudio.parcelas.max=10
flamengo.estudio.parcelas.minima=30
flamengo.estudio.quantidade.max=10
# Painel da demonstração (/mengo-estudio/demo, PR 5): usuários que podem usar (expressão regular sobre o e-mail)
flamengo.estudio.demo.usuarios=torcedor\\d+@example\\.com
# Tamanhos por modelo (MAS, FEM, INF) e tecido (ALG, POL, OVS); combinação sem tamanhos não é vendida
flamengo.estudio.tamanhos.MAS.ALG=P,M,G,GG,XGG
flamengo.estudio.tamanhos.MAS.POL=P,M,G,GG,XGG
flamengo.estudio.tamanhos.MAS.OVS=P,M,G,GG
flamengo.estudio.tamanhos.FEM.ALG=P,M,G,GG
flamengo.estudio.tamanhos.FEM.POL=P,M,G,GG
flamengo.estudio.tamanhos.FEM.OVS=P,M,G,GG
flamengo.estudio.tamanhos.INF.ALG=4,6,8,10,12,14
flamengo.estudio.tamanhos.INF.POL=4,6,8,10,12,14
flamengo.estudio.tamanhos.INF.OVS=
# Medidas de exemplo (tamanho:largura:comprimento em cm), a confirmar com a estamparia
flamengo.estudio.medidas.MAS.ALG=P:50:70,M:53:72,G:56:74,GG:59:76,XGG:62:78
flamengo.estudio.medidas.MAS.POL=P:50:70,M:53:72,G:56:74,GG:59:76,XGG:62:78
flamengo.estudio.medidas.MAS.OVS=P:56:70,M:59:72,G:62:74,GG:65:76
flamengo.estudio.medidas.FEM.ALG=P:44:62,M:47:64,G:50:66,GG:53:68
flamengo.estudio.medidas.FEM.POL=P:44:62,M:47:64,G:50:66,GG:53:68
flamengo.estudio.medidas.FEM.OVS=P:52:64,M:55:66,G:58:68,GG:61:70
flamengo.estudio.medidas.INF.ALG=4:34:46,6:36:50,8:38:54,10:40:58,12:43:62,14:46:66
flamengo.estudio.medidas.INF.POL=4:34:46,6:36:50,8:38:54,10:40:58,12:43:62,14:46:66
# "Avise-me se voltar": texto do consentimento gravado com a inscrição (o mesmo da loja)
flamengo.estudio.aviso.consentimento=Quero receber um e-mail se esta estampa voltar em um novo drop. Finalidade: o e-mail é usado só para este aviso e dá para cancelar quando quiser.
