<section *ngIf="next$ | async as m" class="mdb" aria-labelledby="mdb-title">
  <div class="mdb-inner">
    <div class="mdb-text">
      <p class="mdb-eyebrow">{{ 'mdb.eyebrow' | flaT }}</p>
      <h2 id="mdb-title" class="mdb-title">Flamengo x {{ m.opponent }}</h2>
      <p class="mdb-line">
        {{ weekday(m) }}, {{ m.dateLabel }} · {{ m.timeLabel }} ·
        {{ m.venue }} · {{ m.competition }}
      </p>
    </div>
    <div class="mdb-actions">
      <a class="mdb-btn" [routerLink]="'/matchday'">{{ 'mdb.build' | flaT }}</a>
      <a
        class="mdb-btn mdb-btn-ghost"
        [routerLink]="'/matchday'"
        [queryParams]="{ modo: 'ingresso' }"
        >{{ 'mdb.all' | flaT }}</a
      >
    </div>
  </div>
</section>

<!-- vitrines com as imagens dos jogos e das experiências (04/11) -->
<fla-match-cards></fla-match-cards>
<fla-experience-showcase [dark]="true"></fla-experience-showcase>
