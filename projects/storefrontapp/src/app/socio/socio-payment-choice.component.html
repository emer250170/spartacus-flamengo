<section *ngIf="visible && opts as o" class="spay" aria-labelledby="spay-title">
  <h3 id="spay-title" class="spay-title">{{ title() }}</h3>
  <p class="spay-sub">{{ sub() }}</p>

  <div class="spay-list" role="radiogroup" [attr.aria-label]="title()">
    <label
      *ngFor="let m of o.methods"
      class="spay-opt"
      [class.spay-on]="selected === m"
    >
      <input
        type="radio"
        name="spay-method"
        [value]="m"
        [checked]="selected === m"
        [disabled]="busy"
        (change)="pick(m)"
      />
      <span class="spay-body">
        <span class="spay-name">{{ name(m) }}</span>
        <span class="spay-amount">{{ amount(m) }}</span>
        <small class="spay-hint">{{ hint(m) }}</small>
      </span>
    </label>
  </div>

  <div *ngIf="selected === 'CARTAO_ANUAL'" class="spay-inst">
    <label for="spay-inst">{{ 'spay.installments' | flaT }}</label>
    <select
      id="spay-inst"
      class="form-control"
      [disabled]="busy"
      (change)="setInstallments($any($event.target).value)"
    >
      <option
        *ngFor="let n of parcels"
        [value]="n"
        [selected]="n === installments"
      >
        {{ parcelText(n) }}
      </option>
    </select>
    <small>{{ cardWhere() }}</small>
  </div>

  <p *ngIf="error" class="spay-error" role="alert">{{ error }}</p>

  <div *ngIf="direct" class="spay-upfront">
    <p>
      {{ nextText() }}
    </p>
    <div *ngIf="needsCpf" class="spay-cpf">
      <label for="spay-cpf">{{ 'spay.cpf' | flaT }}</label>
      <input
        id="spay-cpf"
        class="form-control"
        inputmode="numeric"
        autocomplete="off"
        maxlength="14"
        placeholder="000.000.000-00"
        [value]="cpf"
        [attr.aria-invalid]="cpfTouched && !cpfOk"
        (input)="setCpf($any($event.target).value)"
        (blur)="cpfTouched = true"
      />
      <small *ngIf="cpfTouched && !cpfOk" class="spay-error" role="alert">{{
        'spay.cpfInvalid' | flaT
      }}</small>
      <small *ngIf="!cpfTouched || cpfOk">{{ 'spay.cpfHint' | flaT }}</small>
    </div>
    <div class="spay-actions">
      <button type="button" class="btn btn-secondary" (click)="back()">
        {{ 'spay.back' | flaT }}
      </button>
      <button
        type="button"
        class="btn btn-primary"
        [disabled]="busy || (needsCpf && !cpfOk)"
        (click)="next()"
      >
        {{ 'spay.next' | flaT }}
      </button>
    </div>
  </div>
</section>
